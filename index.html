<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DA: PayAtlas</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:#E5E5E5;
font-family:Inter,Arial,sans-serif;
}

#app{
padding:16px;
}


/* HEADER */

.header{

display:flex;
justify-content:space-between;
align-items:center;

background:#090909;

border:1px solid rgba(255,255,255,.12);

border-radius:24px;

padding:12px;

}


.profile-btn,
.wallet-btn{

height:48px;

display:flex;

align-items:center;

gap:10px;

padding:0 18px;

background:#0d0d0d;

border:1px solid rgba(255,255,255,.12);

border-radius:24px;

color:white;

font-size:15px;

}


.avatar{

width:34px;
height:34px;

border-radius:50%;

border:1px solid #C89B3C;

object-fit:cover;

background:#111;

}


.dot{

width:8px;
height:8px;

background:#C89B3C;

border-radius:50%;

box-shadow:0 0 12px #C89B3C;

}



/* HOME */

.card{

margin-top:18px;

background:#080808;

border:1px solid rgba(255,255,255,.12);

border-radius:24px;

padding:22px;

}


.title{

text-align:center;

font-size:28px;

margin:20px 0;

}


.subtitle{

text-align:center;

color:#777;

}



/* PROFILE */

#profile{

display:none;

}


.back{

color:#C89B3C;

margin-bottom:20px;

}


.profile-card{

background:#080808;

border:1px solid rgba(255,255,255,.12);

border-radius:24px;

padding:24px;

}


.big-avatar{

width:90px;
height:90px;

border-radius:50%;

border:1px solid #C89B3C;

object-fit:cover;

}


.item{

height:55px;

margin-top:12px;

border:1px solid rgba(255,255,255,.12);

border-radius:18px;

display:flex;

align-items:center;

padding-left:20px;

color:#aaa;

}

</style>

</head>


<body>


<div id="app">


<div class="header">


<div class="profile-btn" onclick="openProfile()">

<img class="avatar" id="avatar">

<span id="username">
Loading...
</span>

</div>



<div class="wallet-btn" onclick="connectWallet()">

<div class="dot"></div>

Connect Wallet

</div>


</div>



<div id="home">


<div class="card">


<div class="subtitle">
DA: PAYATLAS
</div>


<div class="title">
SYSTEM MAP
</div>


<p style="text-align:center;color:#777">
Orbit module loading...
</p>


</div>


</div>



<div id="profile">


<div class="profile-card">


<div class="back" onclick="closeProfile()">
← Back
</div>


<img class="big-avatar" id="bigAvatar">


<h1 id="profileName"></h1>


<p>
Telegram ID:
<span id="tgid"></span>
</p>


<p>
Wallet:
<span style="color:#C89B3C">
Not connected
</span>
</p>



<div class="item">
Balance
</div>


<div class="item">
Transactions
</div>


<div class="item">
Settings
</div>



</div>


</div>


</div>



<script>


const tg =
window.Telegram.WebApp;


tg.ready();


const user =
tg.initDataUnsafe?.user;



if(user){


document.getElementById("username").innerText =
user.username
?
"@" + user.username
:
user.first_name;



if(user.photo_url){

avatar.src=user.photo_url;

bigAvatar.src=user.photo_url;

}


}



function openProfile(){


home.style.display="none";

profile.style.display="block";


if(user){

profileName.innerText =
user.username
?
"@" + user.username
:
user.first_name;


tgid.innerText=user.id;

}


}



function closeProfile(){

profile.style.display="none";

home.style.display="block";

}



let tonConnectUI;


async function connectWallet(){

try{

if(!tonConnectUI){

tonConnectUI = new TON_CONNECT_UI.TonConnectUI({

manifestUrl:
"https://brainhrcomcast-a11y.github.io/payatlas-connect/tonconnect-manifest.json"

});

}


await tonConnectUI.openModal();


}catch(e){

console.log(e);

alert("Ошибка подключения кошелька");

}

}



</script>


</body>
</html>
